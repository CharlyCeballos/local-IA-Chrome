<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Degradado de fondo (Oscuro y moderno) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2f"/>
      <stop offset="100%" stop-color="#0f0f15"/>
    </linearGradient>
    <!-- Degradado para la IA / El rayo de Bun -->
    <linearGradient id="bunLightning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbf1d3"/> <!-- Color crema/huevo de Bun -->
      <stop offset="50%" stop-color="#ff9d00"/> <!-- Transición energía -->
      <stop offset="100%" stop-color="#ff4500"/>
    </linearGradient>
  </defs>

  <!-- Fondo redondeado estilo app -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Nodos de la Red Neuronal (IA Local) -->
  <g opacity="0.4">
    <line x1="150" y1="180" x2="256" y2="100" stroke="#ff9d00" stroke-width="4" stroke-dasharray="5,5"/>
    <line x1="362" y1="180" x2="256" y2="100" stroke="#ff9d00" stroke-width="4" stroke-dasharray="5,5"/>
    <line x1="150" y1="180" x2="210" y2="320" stroke="#ff9d00" stroke-width="4"/>
    <line x1="362" y1="180" x2="302" y2="320" stroke="#ff9d00" stroke-width="4"/>
    
    <circle cx="256" cy="100" r="12" fill="#ff4500"/>
    <circle cx="150" cy="180" r="16" fill="#ff9d00"/>
    <circle cx="362" cy="180" r="16" fill="#ff9d00"/>
  </g>

  <!-- El Rayo Central (Rendimiento / Bun) -->
  <path d="M290 40 L130 270 L240 270 L210 470 L380 230 L270 230 Z" fill="url(#bunLightning)" filter="drop-shadow(0px 4px 20px rgba(255,157,0,0.5))"/>
  
  <!-- Nodos principales sobre el rayo -->
  <circle cx="210" cy="470" r="10" fill="#fbf1d3"/>
  <circle cx="290" cy="40" r="10" fill="#fbf1d3"/>
</svg>
